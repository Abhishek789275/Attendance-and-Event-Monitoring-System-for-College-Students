services:
  - type: web
    name: attendance-system-backend
    env: docker
    plan: free
    healthCheckPath: /api/events
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
